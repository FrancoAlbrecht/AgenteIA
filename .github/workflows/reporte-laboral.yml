name: Reporte de Vencimientos Laborales

on:
  schedule:
    - cron: '19 6 * * *'   # dispara a las 03:19 ART; con 3-7hs de demora tipica llega ~06:30-10:30 ART
    - cron: '14 10 * * *'  # respaldo 1: dispara ~07:14 ART
    - cron: '41 13 * * *'  # respaldo 2: dispara ~10:41 ART
  workflow_dispatch:        # permite disparo manual desde la pestaña Actions y el de cron-job.org

permissions:
  contents: read
  actions: read  # necesario para que el script chequee corridas previas del día (ver ya_hubo_envio_exitoso_hoy)

jobs:
  enviar-reporte:
    uses: ./.github/workflows/ejecutar-agente.yml
    with:
      sector: laboral
    secrets: inherit
