name: Ejecutar agente (reutilizable)

on:
  workflow_call:
    inputs:
      sector:
        description: Sector a ejecutar (impuestos, auditoria, laboral, consultorias o resumen_r2)
        required: true
        type: string

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # holgura para los reintentos ante caídas de Redmine (agente/redmine.py)
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar agente ${{ inputs.sector }}
        env:
          SECTOR: ${{ inputs.sector }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDMINE_URL: ${{ secrets.REDMINE_URL }}
          REDMINE_API_KEY: ${{ secrets.REDMINE_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
        run: python -m agente "$SECTOR"
