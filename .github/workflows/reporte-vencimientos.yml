name: Reporte de Vencimientos Tributarios

on:
  schedule:
    - cron: '24 6 * * *'   # dispara a las 03:24 ART; con 3-7hs de demora tipica llega ~06:30-10:30 ART
    - cron: '11 10 * * *'  # respaldo 1: dispara ~07:11 ART
    - cron: '37 13 * * *'  # respaldo 2: dispara ~10:37 ART
  workflow_dispatch:        # permite disparo manual desde la pestaña Actions, para pruebas

permissions:
  contents: read
  actions: read  # necesario para que el script chequee corridas previas del día (ver ya_hubo_envio_exitoso_hoy)

jobs:
  enviar-reporte:
    uses: ./.github/workflows/ejecutar-agente.yml
    with:
      sector: impuestos
    secrets: inherit
